<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SLOPE WRITER のアイコン。式で引いた坂（谷形の曲線）をボールが転がってゴールへ向かう。
       アプリ画面と同じ配色: 背景紺 #0b1022、坂は紫、ボールは金、ゴールは薄緑。
       絵柄は中心(256,256)から半径 186px 以内（maskable の安全円 204.8px より内側）。 -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#182352"/>
      <stop offset="60%" stop-color="#0e1430"/>
      <stop offset="100%" stop-color="#0b1022"/>
    </radialGradient>
    <linearGradient id="curve" x1="110" y1="164" x2="402" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a996ff"/>
      <stop offset="50%" stop-color="#8f7cf5"/>
      <stop offset="100%" stop-color="#a996ff"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fffdf3"/>
      <stop offset="30%" stop-color="#ffe28a"/>
      <stop offset="70%" stop-color="#ffd35c"/>
      <stop offset="100%" stop-color="#e8a622"/>
    </radialGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd35c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fffd4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- 坂（谷形の曲線） -->
  <path d="M110,164 Q256,400 402,164" fill="none" stroke="url(#curve)" stroke-width="30" stroke-linecap="round"/>

  <!-- 転がる勢いを示す小さな跡 -->
  <circle cx="197.6" cy="263.1" r="9" fill="#ffd35c" opacity="0.3"/>
  <circle cx="226.8" cy="277.3" r="10" fill="#ffd35c" opacity="0.45"/>

  <!-- ゴール（薄緑の丸） -->
  <circle cx="344" cy="240" r="38" fill="url(#goalGlow)"/>
  <circle cx="344" cy="240" r="22" fill="none" stroke="#7fffd4" stroke-width="9"/>
  <circle cx="344" cy="240" r="9" fill="#7fffd4"/>

  <!-- ボール -->
  <circle cx="168" cy="240" r="52" fill="url(#ballGlow)"/>
  <circle cx="168" cy="240" r="38" fill="url(#ball)"/>
</svg>
